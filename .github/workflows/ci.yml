name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token only ever needs to read the repository here. Left unset it inherits
# the repository default, which can include write access this job has no use for.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run tests
        working-directory: root/SourceCode/Project
        run: make test
